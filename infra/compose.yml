services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatpm
      POSTGRES_USER: chatpm
      POSTGRES_PASSWORD: chatpm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chatpm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpm -d chatpm"]
      interval: 5s
      retries: 10
volumes:
  chatpm_pgdata:
