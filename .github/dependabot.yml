version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep routine dependency bot PRs safe and reviewable. Major upgrades
    # require a dedicated migration PR; security updates are unaffected.
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      development-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-maintenance:
        patterns:
          - 'actions/*'
          - 'github/codeql-action'
        update-types:
          - minor
          - patch
