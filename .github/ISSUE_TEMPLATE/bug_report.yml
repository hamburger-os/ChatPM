name: Bug report / 缺陷报告
description: Report a reproducible problem (do not include secrets or private data).
title: "bug: "
labels: []
body:
  - type: textarea
    id: issue
    attributes:
      label: 问题描述 / What happened
      description: Please include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署模式 / Deployment
      options: [Local development, Self-hosted, Official SaaS, Other]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与验证 / Evidence
      description: Redact tokens, conversations, private URLs and personal information.
