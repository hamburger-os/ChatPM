name: Product verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatpm
          POSTGRES_PASSWORD: chatpm
          POSTGRES_DB: chatpm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chatpm -d chatpm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://chatpm:chatpm@localhost:5432/chatpm
      SESSION_SECRET: ci-test-session-secret-please-replace-123456789
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database schema
        run: npm run db:migrate
      - name: Verify migrations are repeatable
        run: npm run db:migrate
      - name: Outbox reliability integration
        run: node --import tsx packages/core/test/outbox.integration.ts
      - name: Mock AI conversation integration
        run: node --import tsx packages/core/test/ai.integration.ts
      - name: Scheduled reporting integration
        run: node --import tsx packages/core/test/reports.integration.ts
      - name: Build production server
        run: npm run build:server
      - name: Verify compiled database migration
        run: npm run db:migrate:prod
      - name: Compiled API integration smoke test
        env:
          SMOKE_PRODUCTION: '1'
        run: node tools/test/smoke.mjs
      - name: Build web app
        run: npm run build:web
      - name: Check production package
        run: npm run check:distribution
