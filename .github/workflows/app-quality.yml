name: Product verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatpm
          POSTGRES_PASSWORD: chatpm
          POSTGRES_DB: chatpm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chatpm -d chatpm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://chatpm:chatpm@localhost:5432/chatpm
      SESSION_SECRET: ci-test-session-secret-please-replace-123456789
      MODEL_ENCRYPTION_KEY: ci-test-independent-model-secret-key-123456789
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Architecture boundaries
        run: npm run test:architecture
      - name: Synthetic PM golden corpus and scorer
        run: npm run test:ai-evals
      - name: Deployment bootstrap tests
        run: npm run test:ops
      - name: SSE bounded backpressure, drain and disconnected-client tests
        run: node --import tsx --test tools/test/sse-backpressure.test.mjs
      - name: Database schema
        run: npm run db:migrate
      - name: Verify migrations are repeatable
        run: npm run db:migrate
      - name: Independent Worker lane health and fail-closed diagnostics integration
        run: node --import tsx tools/test/worker-health.integration.mjs
      - name: First-account bootstrap token and race integration
        run: node --import tsx packages/core/test/bootstrap.integration.ts
      - name: Outbox lease-aware queue metrics and fault-state PostgreSQL integration
        run: node --import tsx tools/test/outbox-queue-health.integration.mjs
      - name: Account Identity Core registration, login, tenant access and revocation
        run: node --import tsx packages/core/test/account-services.integration.ts
      - name: Single authoritative project owner and migration constraints
        run: node --import tsx packages/core/test/project-owner.integration.ts
      - name: AI authorization version and denial integration
        run: node --import tsx packages/core/test/ai-authorization.integration.ts
      - name: One-time organization invitation integration
        run: node --import tsx packages/core/test/invitations.integration.ts
      - name: Human approval Core authorization and idempotency integration
        run: node --import tsx packages/core/test/approval-commands.integration.ts
      - name: Core Risk registry commands and membership-scoped read integration
        run: node --import tsx packages/core/test/risk-service.integration.ts
      - name: Task archive, restore and immutable history integration
        run: node --import tsx packages/core/test/task-archive.integration.ts
      - name: Core Task commands and no-op domain/event integration
        run: node --import tsx packages/core/test/task-commands.integration.ts
      - name: Core project classification command and rollback integration
        run: node --import tsx packages/core/test/classification-command.integration.ts
      - name: Formal PM Core commands, version, approval, idempotency and events
        run: node --import tsx packages/core/test/pm-command-service.integration.ts
      - name: Current authorized PM history, dependency and project list reads
        run: node --import tsx packages/core/test/pm-read-models.integration.ts
      - name: Current membership and project visibility read model integration
        run: node --import tsx packages/core/test/tenant-structure.integration.ts
      - name: Real portfolio and program pulse integration
        run: node --import tsx packages/core/test/governance-pulse.integration.ts
      - name: Organization governance transaction integration
        run: node --import tsx packages/core/test/organization.integration.ts
      - name: Project governance Core lifecycle, revocation and receipts
        run: node --import tsx packages/core/test/project-governance.integration.ts
      - name: Tenant governance Core CRUD, idempotency and role revocation integration
        run: node --import tsx packages/core/test/tenant-governance.integration.ts
      - name: Project access revocation integration
        run: node --import tsx packages/core/test/project-access.integration.ts
      - name: Platform admin grant revocation integration
        run: node --import tsx packages/core/test/system-access.integration.ts
      - name: Platform model credential read scope and grant revocation integration
        run: node --import tsx packages/core/test/admin-model-scope.integration.ts
      - name: Platform model Core CRUD, provider import, cooldown and audit integration
        run: node --import tsx packages/core/test/platform-model-commands.integration.ts
      - name: Current-authorized Outbox diagnostics and replay integration
        run: node --import tsx packages/core/test/outbox-operations.integration.ts
      - name: Outbox reliability integration
        run: node --import tsx packages/core/test/outbox.integration.ts
      - name: Ordered conversation cursor and revocation integration
        run: node --import tsx packages/core/test/message-queries.integration.ts
      - name: Project scoped reads and role revocation integration
        run: node --import tsx packages/core/test/project-reads.integration.ts
      - name: Mock AI conversation integration
        run: node --import tsx packages/core/test/ai.integration.ts
      - name: Task linkage Worker integration
        run: node --import tsx tools/test/task-linkage-smoke.mjs
      - name: Core reporting permissions, idempotency and publication integration
        run: node --import tsx packages/core/test/report-services.integration.ts
      - name: Scheduled reporting integration
        run: node --import tsx packages/core/test/reports.integration.ts
      - name: Build production server
        run: npm run build:server
      - name: Verify compiled database migration
        run: npm run db:migrate:prod
      - name: Compiled API integration smoke test
        env:
          SMOKE_PRODUCTION: '1'
        run: node tools/test/smoke.mjs
      - name: Build web app
        run: npm run build:web
      - name: Check production package
        run: npm run check:distribution
