name: Cross-platform native builds
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://chatpm:chatpm@127.0.0.1:5432/chatpm
      SESSION_SECRET: native-ci-only-long-random-test-secret-456789
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ops
      - run: npm run build
      - run: npm run check:distribution
      - name: Package experimental portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: chatpm-experimental-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 14
          path: |
            dist/
            apps/web/.next/
            apps/web/next.config.ts
            package.json
            package-lock.json
            tools/ops/
            infra/
            .env.example
            README.md
            LICENSE
