name: Cross-platform native builds
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://chatpm:chatpm@127.0.0.1:5432/chatpm
      SESSION_SECRET: native-ci-only-long-random-test-secret-456789
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Parse Windows service and scheduled-task scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @('infra/windows/install-services.ps1', 'infra/windows/install-backup-task.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $_" }
              exit 1
            }
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ops
      - run: npm run build
      - run: npm run check:distribution
      - name: Package experimental portable distribution
        uses: actions/upload-artifact@v7
        with:
          name: chatpm-experimental-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 14
          path: |
            dist/
            apps/web/.next/
            apps/web/next.config.ts
            package.json
            package-lock.json
            tools/ops/
            infra/
            .env.example
            README.md
            LICENSE
