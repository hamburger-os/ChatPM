name: Documentation governance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate structure, links, and bilingual files
        run: node tools/docs/check-docs.mjs
      - name: Regression tests for root links and Markdown anchors
        run: node --test tools/docs/check-docs.test.mjs
      - name: Verify documentation changes in PR
        if: github.event_name == 'pull_request'
        run: node tools/docs/check-sync.mjs "origin/$GITHUB_BASE_REF" HEAD
