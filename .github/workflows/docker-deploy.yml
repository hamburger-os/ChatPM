name: Docker deployment smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: compose-ci-only-password
      SESSION_SECRET: compose-ci-only-secret-must-be-at-least-32-characters
      MODEL_ENCRYPTION_KEY: compose-ci-only-independent-model-key-123456789
      WEB_ORIGIN: http://127.0.0.1:3000
      CHATPM_PORT: '3000'
      # CI simulates multiple independent users; public registration is an explicit test opt-in.
      REGISTRATION_MODE: open
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose
        run: docker compose -f infra/compose.prod.yml config --quiet
      - name: Verify runtime environment and least-secret Web boundary
        shell: bash
        run: |
          AI_DAILY_REQUEST_LIMIT=73 docker compose -f infra/compose.prod.yml config --format json | jq -e '
            ((.services.worker.environment.AI_DAILY_REQUEST_LIMIT | tostring) == "73") and
            (.services.web.command == ["npm","run","start:web:container"]) and
            (.services.api.environment | has("BOOTSTRAP_TOKEN")) and
            (.services.worker.environment | has("BOOTSTRAP_TOKEN") | not) and
            (.services.migrate.environment | has("BOOTSTRAP_TOKEN") | not) and
            (.services.api.environment.MODEL_DOCKER_GATEWAY_IPS == "") and
            (.services.worker.environment.MODEL_DOCKER_GATEWAY_IPS == "") and
            ((.services.web.environment | has("MODEL_DOCKER_GATEWAY_IPS")) | not) and
            (.services.web.environment | has("SESSION_SECRET") | not) and
            (.services.web.environment | has("PGPASSWORD") | not) and
            (.services.web.environment | has("OPENAI_API_KEY") | not)'
      - name: Build production image
        run: docker compose -f infra/compose.prod.yml build
      - name: Start full stack
        run: docker compose -f infra/compose.prod.yml up -d --wait --no-build
      - name: Exercise web and API authentication
        run: node tools/test/proxy-smoke.mjs
      - name: Check Worker heartbeat and Outbox state
        shell: bash
        run: |
          for i in {1..12}; do
            if docker compose -f infra/compose.prod.yml exec -T api node tools/ops/doctor.mjs; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Stop application writers before recovery drill
        run: docker compose -f infra/compose.prod.yml stop -t 30 web api worker
      - name: Restore real archive into isolated database and compare all tables
        env:
          CI: 'true'
          CHATPM_CI_RESTORE_DRILL: '1'
        run: |
          npm ci --no-audit --no-fund
          node tools/test/restore-drill.mjs
      - name: Verify fresh one-command bootstrap and existing-volume credential protection
        shell: bash
        run: |
          docker compose -f infra/compose.prod.yml down -v --remove-orphans
          unset POSTGRES_PASSWORD SESSION_SECRET REGISTRATION_MODE
          npm run deploy:docker
          CHATPM_TEST_BOOTSTRAP_TOKEN="$(sed -n 's/^BOOTSTRAP_TOKEN=//p' .env)" node tools/test/proxy-smoke.mjs
          cp .env .env.saved
          sed -i '/^POSTGRES_PASSWORD=/d' .env
          if npm run deploy:docker >/tmp/chatpm-protect.log 2>&1; then
            echo 'Credential rotation should have been refused'
            exit 1
          fi
          grep -q 'Recover the original' /tmp/chatpm-protect.log
          mv .env.saved .env
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose.prod.yml logs --no-color --tail=150
      - name: Clean up
        if: always()
        run: docker compose -f infra/compose.prod.yml down -v --remove-orphans
